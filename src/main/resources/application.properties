spring.application.name=StreetProof
spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=200MB

streetproof.work-dir=${user.home}/streetproof-data
streetproof.samples-dir=samples
streetproof.ffmpeg-path=${FFMPEG_PATH:ffmpeg}
streetproof.sample-fps=15
streetproof.max-frames=900
streetproof.default-posted-limit-kmh=50
streetproof.cors-origins=http://localhost:5173,http://localhost:3000

streetproof.livepeer.endpoint=https://agent.livepeer.org/api/mcp/raw
streetproof.livepeer.api-key=${LIVEPEER_API_KEY:}
streetproof.livepeer.timeout-seconds=33
streetproof.livepeer.concurrency=3
streetproof.livepeer.max-retries=4
streetproof.livepeer.cost-per-detection-usd=0.001

streetproof.tracking.min-iou=0.2
streetproof.tracking.max-missed-frames=3
streetproof.tracking.min-track-frames=3
streetproof.tracking.vehicle-labels=car,truck,bus,motorcycle

streetproof.gate.min-clean-frames=6
streetproof.gate.min-r-squared=0.98
streetproof.gate.min-r-squared-approach=0.95
streetproof.gate.max-width-variation=0.15
streetproof.gate.min-confidence=0.5
streetproof.gate.min-kmh=3
streetproof.gate.max-kmh=200
streetproof.gate.edge-margin-px=4

streetproof.dkg.mode=${STREETPROOF_DKG_MODE:cli}
streetproof.dkg.cli-path=dkg
streetproof.dkg.context-graph=streetproof
streetproof.dkg.timeout-seconds=120
spring.web.resources.static-locations=classpath:/static/,file:frontend/dist/
